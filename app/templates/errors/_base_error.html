<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block err_title %}Error{% endblock %} — RDC Teamlease Employee Onboarding Portal</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/inter-font.css') }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    * { -webkit-font-smoothing: antialiased; }
    body {
      margin: 0; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0A2540 0%, #0D3460 50%, #1a1060 100%);
    }
    .card {
      background: #fff; border-radius: 16px; padding: 48px 52px;
      width: 100%; max-width: 480px; margin: 20px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.35);
      text-align: center;
      animation: scaleIn 0.35s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.94); }
      to   { opacity: 1; transform: scale(1); }
    }
    .code {
      font-size: 72px; font-weight: 800; color: #ef8354;
      letter-spacing: -4px; line-height: 1; margin-bottom: 8px;
    }
    h1 { font-size: 22px; font-weight: 700; color: var(--c-text-1); margin: 0 0 10px; }
    p  { font-size: 14px; color: var(--c-text-3); margin: 0 0 28px; line-height: 1.7; }
    .btn {
      display: inline-block; background: #ef8354; color: #fff;
      padding: 11px 28px; border-radius: 8px; font-weight: 600;
      font-size: 14px; text-decoration: none;
      transition: background 0.18s, transform 0.18s;
      box-shadow: 0 2px 10px rgba(99,91,255,0.38);
    }
    .btn:hover { background: #e7733d; transform: translateY(-1px); }
    .divider { border: none; border-top: 1px solid var(--c-bg-2); margin: 28px 0; }
    .footer { font-size: 11.5px; color: var(--c-text-5); }
  </style>
</head>
<body>
<div class="card">
  <div class="code">{% block err_code %}?{% endblock %}</div>
  <h1>{% block err_heading %}Something went wrong{% endblock %}</h1>
  <p>{% block err_body %}An unexpected error occurred.{% endblock %}</p>
  <a href="{{ url_for('main.dashboard') if current_user is defined and current_user.is_authenticated else url_for('auth.login') }}" class="btn">
    Go to Dashboard
  </a>
  <hr class="divider"/>
  <p class="footer">RDC Teamlease Employee Onboarding Portal &mdash; Authorized personnel only</p>
</div>
</body>
</html>
