<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>{{ heading }} — RDC Associates Onboarding</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/inter-font.css') }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center;
           justify-content: center; background: #0D3460 linear-gradient(135deg, #0A2540 0%, #0D3460 50%, #1a1060 100%) fixed no-repeat; background-size: cover; -webkit-font-smoothing: antialiased; }
    .card { background: #fff; border-radius: 16px; padding: 40px 40px 32px; width: 100%; max-width: 480px; margin: 20px; text-align: center;
            box-shadow: 0 32px 80px rgba(0,0,0,.35); }
    .icon { width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700; }
    .icon.ok { background: #ECFDF3; color: #067647; } .icon.bad { background: #FEF3F2; color: #B42318; }
    h1 { font-size: 22px; margin: 0 0 8px; color: #101828; }
    p { font-size: 14px; color: #475467; line-height: 1.65; margin: 0 0 18px; }
    .msg { font-size: 12.5px; color: #475467; background: #F9FAFB; border: 1px solid #EAECF0; border-radius: 8px; padding: 8px 12px; margin: 0 0 8px; text-align: left; }
    .msg.danger { background: #FEF3F2; border-color: #FECDCA; color: #B42318; }
    .msg.warning { background: #FEF3C7; border-color: #FDE68A; color: #92400E; }
    .btn { display: inline-block; background: #ef8354; color: #fff; padding: 11px 28px; border-radius: 8px; font-weight: 600; font-size: 14px; text-decoration: none; margin-top: 10px; }
    .foot { font-size: 11.5px; color: #98A2B3; margin: 24px 0 0; }
  </style>
</head>
<body>
<div class="card">
  <div class="icon {{ 'ok' if ok else 'bad' }}">{{ '✓' if ok else '!' }}</div>
  <h1>{{ heading }}</h1>
  <p>{{ message }}</p>
  {% for category, text in messages %}<div class="msg {{ category }}">{{ text }}</div>{% endfor %}
  <a href="{{ url_for('auth.login') }}" class="btn">Open RDC Associates Onboarding</a>
  <p class="foot">RDC Associates Onboarding &mdash; Authorized personnel only</p>
</div>
</body>
</html>
